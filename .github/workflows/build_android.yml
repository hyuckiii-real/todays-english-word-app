name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter project structure with Internet permission
        run: |
          rm -rf android
          flutter create . --org com.todaysx --project-name todays_english_word

          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSION_LINE='    <uses-permission android:name="android.permission.INTERNET" />'
          sed -i "/<manifest/a $PERMISSION_LINE" "$MANIFEST_PATH"
          sed -i 's/android:label="todays_english_word"/android:label="오늘의 영단어"/g' "$MANIFEST_PATH"

          cat "$MANIFEST_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todays-english-word-apk
          path: build/app/outputs/flutter-apk/app-release.apk
