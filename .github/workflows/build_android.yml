name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Initialize Flutter project structure with Internet & AdMob
        run: |
          rm -rf android
          flutter create . --org com.todaysx --project-name todays_english_word

          python3 - << 'EOF'
          import re, os

          # 1. gradle-wrapper.properties -> Gradle 8.4 고정
          wrapper_path = "android/gradle/wrapper/gradle-wrapper.properties"
          with open(wrapper_path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"gradle-[0-9.]+-(all|bin)\.zip", "gradle-8.4-all.zip", content)
          with open(wrapper_path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. settings.gradle(.kts) -> AGP 8.2.1 & Kotlin 1.9.22 고정
          for s_path in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(s_path):
                  with open(s_path, "r", encoding="utf-8") as f:
                      s_content = f.read()
                  s_content = re.sub(r'("com\.android\.application"\s+version\s+")[^"]+(")', r'\g<1>8.2.1\g<2>', s_content)
                  s_content = re.sub(r'("org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")', r'\g<1>1.9.22\g<2>', s_content)
                  with open(s_path, "w", encoding="utf-8") as f:
                      f.write(s_content)

          # 3. AndroidManifest.xml 덮어쓰기 (인터넷 + AdMob 테스트 앱 ID)
          manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />

              <application
                  android:label="오늘의 영단어"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          '''
          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todays-english-word-apk
          path: build/app/outputs/flutter-apk/app-release.apk
