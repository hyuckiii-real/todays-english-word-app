name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter project structure with Internet permission
        run: |
          # 1. android 폴더가 혹시 불완전하게 있으면 싹 지우고 깨끗하게 재생성
          rm -rf android
          flutter create . --org com.todaysx --project-name todays_english_word
          
          # 2. 자동 생성된 AndroidManifest.xml에 인터넷 권한(<uses-permission>) 코드 자동 삽입
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSION_LINE='    <uses-permission android:name="android.permission.INTERNET" />'
          
          # <manifest 바로 아래에 인터넷 권한 한 줄을 삽입합니다.
          sed -i "/<manifest/a $PERMISSION_LINE" "$MANIFEST_PATH"
          
          # 3. 확인을 위해 수정된 매니페스트 출력
          cat "$MANIFEST_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todays-english-word-apk
          path: build/app/outputs/flutter-apk/app-release.apk
