name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter project structure with Internet & AdMob
        run: |
          rm -rf android
          flutter create . --org com.todaysx --project-name todays_english_word
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSION_LINE='    <uses-permission android:name="android.permission.INTERNET" />'
          ADMOB_META='        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
          
          sed -i "/<manifest/a $PERMISSION_LINE" "$MANIFEST_PATH"
          sed -i "/<\/application>/i $ADMOB_META" "$MANIFEST_PATH"
          
          cat "$MANIFEST_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todays-english-word-apk
          path: build/app/outputs/flutter-apk/app-release.apk
