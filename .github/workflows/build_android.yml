name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter project structure with Internet & AdMob
        run: |
          rm -rf android
          flutter create . --org com.todaysx --project-name todays_english_word

          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              xml = f.read()

          perm = "    <uses-permission android:name=\"android.permission.INTERNET\" />\n"
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", perm + "    <application", 1)

          meta = "        <meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"ca-app-pub-3940256099942544~3347511713\"/>\n    </application>"
          xml = xml.replace("</application>", meta, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(xml)
          '

          cat android/app/src/main/AndroidManifest.xml

          # Android Lint 내부 크래시 방지 설정 추가
          echo -e "\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}" >> android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todays-english-word-apk
          path: build/app/outputs/flutter-apk/app-release.apk
